<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIBE.EXE</title>
<meta name="description" content="VIBE.EXE — a black and white pixel experiment.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --dim: #8a8a8a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "VT323", ui-monospace, monospace;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  /* Холст с руками на весь экран */
  #hands { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* Полосы как на старом мониторе */
  .scan {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,.035) 0 1px, transparent 1px 3px);
  }

  /* Надписи по углам */
  .corner { position: fixed; z-index: 6; font-size: 22px; letter-spacing: 1px; line-height: 1; }
  .tl { top: 24px; left: 28px; font-size: 30px; }
  .tr { top: 28px; right: 28px; color: var(--dim); }
  .bl { bottom: 26px; left: 28px; color: var(--dim); }
  .br { bottom: 26px; right: 28px; color: var(--dim); text-align: right; }
  .blink { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* Окошко VIBE.EXE */
  .win {
    position: fixed; z-index: 7;
    border: 2px solid var(--fg);
    background: transparent;
    opacity: 0; transform: scale(.96);
    transition: opacity .4s, transform .4s;
  }
  .win.show { opacity: 1; transform: none; }
  .win.dragging { transition: none; }
  .bar {
    display: flex; align-items: center; justify-content: space-between;
    height: 26px; padding: 0 4px 0 10px;
    border-bottom: 2px solid var(--fg);
    background: var(--bg);
    font-size: 20px; letter-spacing: 1px;
    cursor: grab;
  }
  .win.dragging .bar { cursor: grabbing; }
  .btns { display: flex; gap: 3px; }
  .btns button {
    width: 18px; height: 16px;
    border: 2px solid var(--fg); background: var(--bg); color: var(--fg);
    font: inherit; font-size: 14px; line-height: 10px; cursor: pointer;
  }
  .btns button:hover { background: var(--fg); color: var(--bg); }
  .term {
    padding: 10px 12px; font-size: 21px; line-height: 1.15;
    min-height: calc(100% - 26px);
    white-space: pre-wrap;
  }
  .txt { background: var(--bg); box-decoration-break: clone; -webkit-box-decoration-break: clone; padding: 0 2px; }
  .win.min .term { display: none; }
  .cursor { display: inline-block; width: .55em; height: .9em; background: var(--fg); vertical-align: -1px; }

  /* Кнопка, чтобы вернуть закрытое окно */
  .reopen {
    position: fixed; z-index: 7; left: 50%; bottom: 22px; transform: translateX(-50%);
    border: 2px solid var(--fg); background: var(--bg); color: var(--fg);
    font: inherit; font-size: 22px; padding: 4px 14px; cursor: pointer; display: none;
  }
  .reopen:hover { background: var(--fg); color: var(--bg); }

  @media (max-width: 640px) {
    .corner { font-size: 18px; }
    .tl { top: 18px; left: 16px; font-size: 26px; }
    .tr { top: 21px; right: 16px; }
    .bl { bottom: 18px; left: 16px; }
    .br { bottom: 18px; right: 16px; }
    .term { font-size: 19px; }
  }
</style>
</head>
<body>

<canvas id="hands" aria-label="Two pixel hands reaching for each other"></canvas>
<div class="scan"></div>

<div class="corner tl">VIBE.EXE<span class="blink">_</span></div>
<div class="corner tr">EXPERIMENT_01</div>
<div class="corner bl" id="hint">MOVE YOUR CURSOR</div>
<div class="corner br" id="coords">X:000 Y:000</div>

<div class="win" id="win">
  <div class="bar" id="bar">
    <span>VIBE.EXE</span>
    <div class="btns">
      <button id="btnMin" aria-label="Minimize">_</button>
      <button id="btnClose" aria-label="Close">x</button>
    </div>
  </div>
  <div class="term" id="term"></div>
</div>
<button class="reopen" id="reopen">[ RUN VIBE.EXE ]</button>

        for (let j = 0; j < 46; j++) {
          const a = Math.random() * Math.PI * 2, sp = 0.6 + Math.random() * 2.6;
          sparks.push({ x: GAP_X, y: GAP_Y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1 });
        }
      }
      if (d < 0.5) sparked = false;
    }

    pix.fill(BLACK);

    // Немного «шума» на фоне
    for (let j = 0; j < 70; j++) {
      pix[((Math.random() * H) | 0) * W + ((Math.random() * W) | 0)] = GREY;
    }

    const R = touch ? 34 : 26, R2 = R * R;
    for (let j = 0; j < n; j++) {
      const sd = side[j];
      const tx = hx[j] + (sd ? -reach : reach);
      const ty = hy[j] + (sd ? -float : float);
      let ax = (tx - px[j]) * k, ay = (ty - py[j]) * k;
      if (active) {
        const dx = px[j] - mx, dy = py[j] - my, q = dx * dx + dy * dy;
        if (q < R2 && q > 0.01) {
          const dist = Math.sqrt(q), f = (1 - dist / R) * 2.4;
          ax += dx / dist * f; ay += dy / dist * f;
        }
      }
      vx[j] = (vx[j] + ax) * 0.86;
      vy[j] = (vy[j] + ay) * 0.86;
      px[j] += vx[j]; py[j] += vy[j];
      const x = px[j] | 0, y = py[j] | 0;
      if (x >= 0 && x < W && y >= 0 && y < H && Math.random() > 0.003) pix[y * W + x] = WHITE;
    }

    // Искры
    for (let j = sparks.length - 1; j >= 0; j--) {
      const p = sparks[j];
      p.x += p.vx; p.y += p.vy; p.vx *= 0.95; p.vy *= 0.95; p.life -= 0.018;
      if (p.life <= 0) { sparks.splice(j, 1); continue; }
      const x = p.x | 0, y = p.y | 0;
      if (x >= 0 && x < W && y >= 0 && y < H) pix[y * W + x] = p.life > 0.4 ? WHITE : GREY;
    }
    // Свечение в точке касания
    if (flash > 0.02) {
      const r = (1 - flash) * 22;
      for (let a = 0; a < 64; a++) {
        const x = (GAP_X + Math.cos(a / 64 * Math.PI * 2) * r) | 0;
        const y = (GAP_Y + Math.sin(a / 64 * Math.PI * 2) * r) | 0;
        if (x >= 0 && x < W && y >= 0 && y < H) pix[y * W + x] = WHITE;
      }
    }

    bctx.putImageData(img, 0, 0);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, vw, vh);
    ctx.drawImage(buf, ox, oy, W * s, H * s);

    // Помехи: сдвигаем горизонтальные полоски
    if (glitch > 0) {
      for (let j = 0; j < 5; j++) {
        const sy = Math.random() * H, sh = 2 + Math.random() * 14;
        const shift = (Math.random() - 0.5) * 40;
        ctx.fillStyle = "#000";
        ctx.fillRect(0, oy + sy * s, vw, sh * s);
        ctx.drawImage(buf, 0, sy, W, sh, ox + shift * s, oy + sy * s, W * s, sh * s);
      }
      glitch--;
    }
    if (flash > 0) {
      ctx.fillStyle = "rgba(255,255,255," + (flash * 0.12) + ")";
      ctx.fillRect(0, 0, vw, vh);
      flash *= 0.9;
    }

    requestAnimationFrame(frame);
  }

  // ---------- Окошко ----------
  const win = document.getElementById("win");
  const bar = document.getElementById("bar");
  const term = document.getElementById("term");
  const reopen = document.getElementById("reopen");
  let moved = false;

  function placeWindow() {
    // Там же, где окно было на картинке
    const w = Math.min(Math.max(250, 246 * s), vw - 32, 440);
    const h = winHeight();
    win.style.width = w + "px";
    win.style.height = h + "px";
    let x = ox + 387 * s - w / 2, y = oy + 108 * s - h / 2;
    // На телефоне окно внизу, чтобы не закрывать пальцы
    if (vw < 640) y = Math.max(oy + H * s * 0.8, vh - h - 56);
    win.style.left = Math.max(16, Math.min(vw - w - 16, x)) + "px";
    win.style.top = Math.max(60, y) + "px";
  }
  function winHeight() {
    return vw < 640 ? 150 : Math.max(170, Math.min(180 * s, 320));
  }

  let dragX = 0, dragY = 0, dragging = false;
  bar.addEventListener("pointerdown", e => {
    if (e.target.closest("button")) return;
    dragging = true; moved = true;
    win.classList.add("dragging");
    dragX = e.clientX - win.offsetLeft; dragY = e.clientY - win.offsetTop;
    bar.setPointerCapture(e.pointerId);
  });
  bar.addEventListener("pointermove", e => {
    if (!dragging) return;
    const x = Math.max(0, Math.min(vw - win.offsetWidth, e.clientX - dragX));
    const y = Math.max(0, Math.min(vh - 30, e.clientY - dragY));
    win.style.left = x + "px"; win.style.top = y + "px";
  });
  const stopDrag = () => { dragging = false; win.classList.remove("dragging"); };
  bar.addEventListener("pointerup", stopDrag);
  bar.addEventListener("pointercancel", stopDrag);

  document.getElementById("btnMin").addEventListener("click", () => {
    win.classList.toggle("min");
    win.style.height = win.classList.contains("min") ? "auto" : "";
    if (!win.classList.contains("min")) win.style.height = winHeight() + "px";
  });
  document.getElementById("btnClose").addEventListener("click", () => {
    win.classList.remove("show");
    setTimeout(() => { win.style.display = "none"; reopen.style.display = "block"; }, 400);
  });
  reopen.addEventListener("click", () => {
    reopen.style.display = "none";
    win.style.display = "";
    win.classList.remove("min");
    moved = false; placeWindow();
    requestAnimationFrame(() => win.classList.add("show"));
    type();
  });

  // Текст печатается, как в терминале
  const LINES = [
    "> booting vibe.exe...",
    "> loading hands ....... ok",
    "> human  <->  machine",
    "> status: almost touching",
  ];
  let typing = 0;
  async function type() {
    const id = ++typing;
    term.innerHTML = "";
    const out = document.createElement("span");
    out.className = "txt";
    term.appendChild(out);
    const wait = ms => new Promise(r => setTimeout(r, reduce ? 0 : ms));
    for (const line of LINES) {
      for (const ch of line) {
        if (id !== typing) return;
        out.textContent += ch;
        await wait(38 + Math.random() * 40);
      }
      out.textContent += "\n";
      await wait(420);
    }
    if (id !== typing) return;
    const c = document.createElement("span");
    c.className = "cursor blink";
    out.textContent += "> ";
    out.appendChild(c);
  }

  addEventListener("resize", layout);
  layout();
  requestAnimationFrame(frame);
  setTimeout(() => { win.classList.add("show"); type(); }, reduce ? 0 : 2200);
})();
</script>
</body>
